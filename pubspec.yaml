name: restaurant_mobile
description: "Restaurant Waiter App - POS Mobile Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # HTTP client
  http: ^1.2.2
  # Secure token storage
  flutter_secure_storage: ^9.2.4
  # State management
  provider: ^6.1.2
  # Shared preferences for caching
  shared_preferences: ^2.3.3
  # Device info for device_name
  device_info_plus: ^12.4.0
  # Image caching
  cached_network_image: ^3.4.1
  # Badge / notification
  badges: ^3.1.2
  # Connectivity check
  connectivity_plus: ^6.1.0
  # Pull to refresh
  pull_to_refresh_flutter3: ^2.0.2
  # Shimmer loading effect
  shimmer: ^3.0.0
  # Lottie animation (optional for loading/empty states)
  lottie: ^3.1.3
  # Internationalization (date/number formatting)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
